name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: claims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: test
        run: cd server && uv sync && uv run pytest -q -p no:cacheprovider
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/claims_test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build and lint
        run: cd app && npm ci && npm run build && npm run lint

  e2e:
    # T45: the claimant PWA in a real browser against the fake model (server/tests_e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: claims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: build the PWA
        run: cd app && npm ci && npm run build
      - name: install Chromium
        run: cd server && uv sync && uv run --with playwright==1.64.1 python -m playwright install --with-deps chromium
      - name: e2e
        run: cd server && uv run --with playwright==1.64.1 python -m pytest tests_e2e -q -rs -p no:cacheprovider
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/claims_test
          E2E_CHANNEL: chromium
          E2E_REQUIRED: "1"
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimant-screens
          path: server/tests_e2e/screens/
          if-no-files-found: ignore
